    <style>
        /* Highlight selected category button */
        #gallery-nav .neu-button.selected {
            background-color: var(--accent-brown);
            color: #ffffff;
            box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.15),
                        inset -4px -4px 8px rgba(255, 255, 255, 0.2);
        }
        
        /* Video gallery items match img styling */
        #gallery-grid video {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 12px;
            transition: transform 0.3s ease;
        }
        
        #gallery-grid video:hover {
            transform: scale(1.05);
        }

        .lightbox-video {
            max-width: 90vw;
            max-height: 90vh;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: zoom-out;
        }

        .lightbox-overlay.active .lightbox-video {
            transform: scale(1) !important;
        }

        /* Gallery Nav Container & Mobile Scrolling Enhancements */
        .gallery-nav-wrapper {
            position: relative;
            width: 100%;
            margin: 0 auto;
        }

        .gallery-nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 25px;
        }

        /* Gradient fade masks */
        .nav-mask {
            position: absolute;
            top: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.25s ease, visibility 0.25s ease;
        }

        .nav-mask-left {
            left: 0;
            width: 40px;
            background: linear-gradient(to right, #FDFCF0 25%, rgba(253, 252, 240, 0));
        }

        .nav-mask-right {
            right: 0;
            width: 48px;
            background: linear-gradient(to left, #FDFCF0 25%, rgba(253, 252, 240, 0));
        }

        .nav-mask.active {
            opacity: 1;
            visibility: visible;
        }

        /* Nav Scroll Buttons (Functional Arrows) */
        .nav-scroll-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: var(--bg-color);
            border: 1.5px solid var(--accent-pink);
            color: var(--accent-brown);
            font-size: 16px;
            line-height: 1;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 6;
            box-shadow: 2px 2px 6px var(--dark-shadow);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.25s ease, visibility 0.25s ease, transform 0.15s ease, background-color 0.2s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-scroll-btn.active {
            opacity: 0.95;
            visibility: visible;
            pointer-events: auto;
        }

        .nav-scroll-btn:hover {
            background-color: var(--cookie-color);
            transform: translateY(-50%) scale(1.08);
        }

        .nav-scroll-btn:active {
            transform: translateY(-50%) scale(0.92);
        }

        .nav-scroll-left {
            left: 3px;
        }

        .nav-scroll-right {
            right: 3px;
        }

        /* Mobile Scroll Hint Text */
        .gallery-nav-hint {
            display: none;
            text-align: center;
            font-size: 0.78rem;
            color: #9A857A;
            margin: 2px auto 20px;
            letter-spacing: 0.5px;
            user-select: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            opacity: 0.85;
            transition: opacity 0.25s ease;
        }

        .gallery-nav-hint .hint-arrow {
            font-size: 0.82rem;
            color: var(--accent-brown);
            display: inline-block;
        }

        /* Desktop: hide mobile-only indicators and keep natural centered wrapping layout */
        @media (min-width: 769px) {
            .nav-mask,
            .nav-scroll-btn,
            .gallery-nav-hint {
                display: none !important;
            }
            .gallery-nav-wrapper {
                overflow: visible !important;
            }
            .gallery-nav {
                display: flex !important;
                flex-wrap: wrap !important;
                justify-content: center !important;
                overflow: visible !important;
                padding: 0 !important;
            }
        }

        /* Mobile specific styles */
        @media (max-width: 768px) {
            .gallery-page {
                padding-left: 4vw !important;
                padding-right: 4vw !important;
            }
            .gallery-nav-wrapper {
                overflow: hidden;
                margin-bottom: 4px;
            }
            .gallery-nav {
                display: flex !important;
                flex-wrap: nowrap !important;
                overflow-x: auto !important;
                overflow-y: hidden !important;
                justify-content: flex-start !important;
                padding: 8px 18px 8px 12px !important;
                gap: 8px !important;
                margin-bottom: 0 !important;
                -webkit-overflow-scrolling: touch;
                scroll-behavior: smooth;
                scrollbar-width: none;
            }
            .gallery-nav::-webkit-scrollbar {
                display: none;
            }
            .gallery-nav .neu-button {
                flex: 0 0 auto !important;
                padding: 8px 16px !important;
                font-size: 0.88rem !important;
                margin: 0 !important;
            }
            .gallery-nav-hint {
                display: flex;
            }
            .gallery-grid {
                grid-template-columns: repeat(2, 1fr) !important;
                gap: 12px !important;
            }
        }
    </style>

        // Mobile horizontal scroll and indicator logic
        function scrollNav(direction) {
            const nav = document.getElementById('gallery-nav');
            if (!nav) return;
            const distance = Math.max(160, nav.clientWidth * 0.65);
            const scrollAmount = direction === 'left' ? -distance : distance;
            nav.scrollBy({ left: scrollAmount, behavior: 'smooth' });
        }

        function updateNavScrollState() {
            const nav = document.getElementById('gallery-nav');
            if (!nav) return;

            const maskLeft = document.getElementById('navMaskLeft');
            const maskRight = document.getElementById('navMaskRight');
            const btnLeft = document.getElementById('navScrollLeft');
            const btnRight = document.getElementById('navScrollRight');
            const hint = document.getElementById('galleryNavHint');

            const scrollLeft = nav.scrollLeft;
            const scrollWidth = nav.scrollWidth;
            const clientWidth = nav.clientWidth;
            const maxScroll = scrollWidth - clientWidth;

            // Check if scrolling is needed (threshold of 4px for subpixel differences)
            const isScrollable = maxScroll > 4;

            if (!isScrollable) {
                if (maskLeft) maskLeft.classList.remove('active');
                if (maskRight) maskRight.classList.remove('active');
                if (btnLeft) btnLeft.classList.remove('active');
                if (btnRight) btnRight.classList.remove('active');
                if (hint) hint.style.display = 'none';
                return;
            }

            // On mobile screens, show hint if scrollable
            if (window.innerWidth <= 768 && hint) {
                hint.style.display = 'flex';
            }

            // Can we scroll left?
            const canScrollLeft = scrollLeft > 6;
            if (maskLeft) maskLeft.classList.toggle('active', canScrollLeft);
            if (btnLeft) btnLeft.classList.toggle('active', canScrollLeft);

            // Can we scroll right?
            const canScrollRight = scrollLeft < maxScroll - 6;
            if (maskRight) maskRight.classList.toggle('active', canScrollRight);
            if (btnRight) btnRight.classList.toggle('active', canScrollRight);
        }

        function initNavScroll() {
            const nav = document.getElementById('gallery-nav');
            if (nav) {
                nav.addEventListener('scroll', updateNavScrollState, { passive: true });
            }
            window.addEventListener('resize', updateNavScrollState);
            setTimeout(updateNavScrollState, 80);
        }

        function renderGallery() {
            const nav = document.getElementById('gallery-nav');
            const categories = [...new Set(galleryItems.map(item => item.category))];

            nav.innerHTML = categories.map(cat => {
                const label = (cat === '驚喜麵包') ? '驚喜麵包' : cat;
                return `<button class="neu-button" onclick="filterGallery(this, '${cat}')">${label}</button>`;
            }).join('');

            // Hide the grid contents and show the placeholder
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '';
            const placeholder = document.getElementById('gallery-placeholder');
            if (placeholder) {
                placeholder.style.display = 'block';
            }
            // Hide the shortcut container
            const shortcutContainer = document.getElementById('order-shortcut-container');
            if (shortcutContainer) {
                shortcutContainer.style.display = 'none';
            }

            setTimeout(updateNavScrollState, 50);
        }

        function filterGallery(btn, category) {
            // Remove 'selected' class from all buttons
            const buttons = document.querySelectorAll('#gallery-nav .neu-button');
            buttons.forEach(b => b.classList.remove('selected'));

            // Add 'selected' class to the clicked button
            if (btn) {
                btn.classList.add('selected');

                // On mobile, smoothly center the clicked category button in the scroll view
                if (btn.parentElement && window.innerWidth <= 768) {
                    const parent = btn.parentElement;
                    const btnLeft = btn.offsetLeft;
                    const btnWidth = btn.offsetWidth;
                    const parentWidth = parent.clientWidth;
                    const targetScroll = btnLeft - (parentWidth / 2) + (btnWidth / 2);
                    parent.scrollTo({ left: targetScroll, behavior: 'smooth' });
                }
            }

            // Hide the placeholder
            const placeholder = document.getElementById('gallery-placeholder');
            if (placeholder) {
                placeholder.style.display = 'none';
            }

            // Show shortcut button if there is a corresponding product
            const shortcutContainer = document.getElementById('order-shortcut-container');
            const shortcutBtn = document.getElementById('order-shortcut-btn');
            if (shortcutContainer && shortcutBtn) {
                const prodKey = categoryToProduct[category];
                if (prodKey) {
                    shortcutBtn.href = `index.html?order=${prodKey}`;
                    const label = (category === '驚喜麵包') ? '🍞 驚喜麵包' : category;
                    shortcutBtn.innerHTML = `👉 立即前往下訂「${label}」系列 🛒`;
                    shortcutContainer.style.display = 'block';
                } else {
                    shortcutContainer.style.display = 'none';
                }
            }

            const grid = document.getElementById('gallery-grid');
            const filtered = galleryItems.filter(item => item.category === category);

            grid.innerHTML = filtered.map(item => {
                const isVideo = item.src.endsWith('.mp4');
                if (isVideo) {
                    return `
                        <div class="gallery-item" data-category="${item.category}" style="padding: 0; overflow: hidden; background: var(--cookie-color); border-radius: 12px; box-shadow: inset 5px 5px 10px var(--dark-shadow), inset -5px -5px 10px var(--light-shadow); break-inside: avoid; margin-bottom: 25px; cursor: pointer;">
                            <video src="./${item.src}" muted loop playsinline preload="metadata"
                                   onclick="openLightbox('./${item.src}', true)"
                                   onmouseenter="this.play()"
                                   onmouseleave="this.pause(); this.currentTime = 0;"
                                   style="width: 100%; height: auto; display: block; border-radius: 12px; transition: transform 0.3s ease; object-fit: cover; aspect-ratio: 1/1;"
                                   onmouseover="this.style.transform='scale(1.05)'"
                                   onmouseout="this.style.transform='scale(1)'"></video>
                        </div>
                    `;
                } else {
                    return `
                        <div class="gallery-item" data-category="${item.category}" style="padding: 0; overflow: hidden; background: var(--cookie-color); border-radius: 12px; box-shadow: inset 5px 5px 10px var(--dark-shadow), inset -5px -5px 10px var(--light-shadow); break-inside: avoid; margin-bottom: 25px; cursor: pointer;">
                            <img src="./thumbnails/${item.src}" loading="lazy" alt="${item.category}" 
                                 onerror="if(this.src.indexOf('thumbnails') !== -1){ this.src='./${item.src}'; } else { console.warn('圖片載入失敗:', '${item.src}'); this.onerror=null; this.src='https://placehold.co/400x400?text=Not+Found'; }"
                                 onclick="openLightbox('./${item.src}', false)" style="width: 100%; height: auto; display: block; border-radius: 12px; transition: transform 0.3s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'" />
                        </div>
                    `;
                }
            }).join('');
        }

        // Lightbox functionality
        function openLightbox(src, isVideo = false) {
            const overlay = document.getElementById('lightboxModal');
            const img = document.getElementById('lightboxImg');
            const video = document.getElementById('lightboxVideo');

            // Pause all grid videos first
            document.querySelectorAll('#gallery-grid video').forEach(v => {
                v.pause();
                v.currentTime = 0;
            });

            if (isVideo) {
                img.style.display = 'none';
                img.src = '';
                video.src = src;
                video.style.display = 'block';
                video.currentTime = 0;
                video.play().catch(err => console.log("Autoplay prevented:", err));
            } else {
                video.style.display = 'none';
                video.pause();
                video.src = '';
                img.src = src;
                img.style.display = 'block';
            }

            overlay.classList.add('active');

            // Handle loading error in lightbox as well
            img.onerror = () => {
                console.warn('圖片載入失敗 (大圖):', src);
                img.src = 'https://placehold.co/400x400?text=Not+Found';
            };
        }

        function closeLightbox() {
            const overlay = document.getElementById('lightboxModal');
            const video = document.getElementById('lightboxVideo');
            overlay.classList.remove('active');
            
            if (video) {
                video.pause();
                video.currentTime = 0;
            }

            setTimeout(() => {
                document.getElementById('lightboxImg').src = '';
                if (video) {
                    video.src = '';
                }
            }, 300); // Clear src after transition
        }

        // Handle Escape key to close lightbox
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeLightbox();
            }
        });

        // Add fun random floating to decor emojis
        document.querySelectorAll('.decor').forEach(el => {
            el.animate([
                { transform: 'translateY(0) rotate(0deg)' },
                { transform: `translateY(${-20 + Math.random() * -10}px) rotate(${Math.random() * 20 - 10}deg)` },
                { transform: 'translateY(0) rotate(0deg)' }
            ], {
                duration: 3000 + Math.random() * 2000,
                iterations: Infinity,
                easing: 'ease-in-out'
            });
        });

        document.addEventListener('DOMContentLoaded', () => {
            renderGallery();
            initNavScroll();
        });
    </script>
</body>

</html>

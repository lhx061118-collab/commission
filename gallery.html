        function renderGallery() {
            const nav = document.getElementById('gallery-nav');
            const categories = ['All 🌟', ...new Set(galleryItems.map(item => item.category))];

            nav.innerHTML = categories.map(cat =>
                `<button class="neu-button" onclick="filterGallery('${cat}')" style="margin: 5px;">${cat}</button>`
            ).join('');

            filterGallery('All 🌟');
        }

        function filterGallery(category) {
            const grid = document.getElementById('gallery-grid');
            const filtered = category === 'All 🌟'
                ? galleryItems
                : galleryItems.filter(item => item.category === category);

            grid.innerHTML = filtered.map(item => `
                <div class="gallery-item" data-category="${item.category}" style="padding: 0; overflow: hidden; background: var(--cookie-color); border-radius: 12px; box-shadow: inset 5px 5px 10px var(--dark-shadow), inset -5px -5px 10px var(--light-shadow); break-inside: avoid; margin-bottom: 25px; cursor: pointer;">
                    <img src="./${item.src}" loading="lazy" alt="${item.category}" 
                         onerror="console.warn('圖片載入失敗:', '${item.src}'); this.onerror=null; this.src='https://placehold.co/400x400?text=Not+Found';"
                         onclick="openLightbox('./${item.src}')" style="width: 100%; height: auto; display: block; border-radius: 12px; transition: transform 0.3s ease;" onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'" />
                </div>
            `).join('');
        }

        // Lightbox functionality
        function openLightbox(src) {
            const overlay = document.getElementById('lightboxModal');
            const img = document.getElementById('lightboxImg');
            img.src = src;
            overlay.classList.add('active');

            // Handle loading error in lightbox as well
            img.onerror = () => {
                console.warn('圖片載入失敗 (大圖):', src);
                img.src = 'https://placehold.co/400x400?text=Not+Found';
            };
        }

        function closeLightbox() {
            const overlay = document.getElementById('lightboxModal');
            overlay.classList.remove('active');
            setTimeout(() => {
                document.getElementById('lightboxImg').src = '';
            }, 300); // Clear src after transition
        }

        // Handle Escape key to close lightbox
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeLightbox();
            }
        });

        // Add fun random floating to decor emojis
        document.querySelectorAll('.decor').forEach(el => {
            el.animate([
                { transform: 'translateY(0) rotate(0deg)' },
                { transform: `translateY(${-20 + Math.random() * -10}px) rotate(${Math.random() * 20 - 10}deg)` },
                { transform: 'translateY(0) rotate(0deg)' }
            ], {
                duration: 3000 + Math.random() * 2000,
                iterations: Infinity,
                easing: 'ease-in-out'
            });
        });

        document.addEventListener('DOMContentLoaded', renderGallery);
